[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's own build-settings validation rejects a build whose resolved
# publish directory equals the base directory — confirmed the actual
# cause of this deploy failing (twice) once `publish` was removed in an
# earlier attempt to "modernize" this file, regardless of whether the
# plugin below was declared or not. Restored to match this site's
# previously-working configuration. The actual runtime adaptation
# (server actions, src/proxy.ts, image optimization) is handled by the
# Next.js Runtime, which this site already has installed (auto-detected
# for Next.js projects; also pinned as a devDependency in package.json)
# — no explicit [[plugins]] block needed here.
